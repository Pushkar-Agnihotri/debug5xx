<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="system-ui, sans-serif" font-size="14">
  <title>Keep-alive race: the app closes an idle connection while the load balancer reuses it</title>
  <rect width="640" height="380" fill="#ffffff"/>

  <!-- lanes -->
  <text x="140" y="30" text-anchor="middle" font-weight="bold">Load balancer</text>
  <text x="500" y="30" text-anchor="middle" font-weight="bold">Your app</text>
  <line x1="140" y1="42" x2="140" y2="360" stroke="#999" stroke-dasharray="4 4"/>
  <line x1="500" y1="42" x2="500" y2="360" stroke="#999" stroke-dasharray="4 4"/>

  <!-- request 1 -->
  <line x1="140" y1="70" x2="496" y2="70" stroke="#2b6cb0" stroke-width="2" marker-end="url(#blue)"/>
  <text x="320" y="62" text-anchor="middle" fill="#2b6cb0">request 1</text>
  <line x1="500" y1="100" x2="144" y2="100" stroke="#2b6cb0" stroke-width="2" marker-end="url(#blue)"/>
  <text x="320" y="92" text-anchor="middle" fill="#2b6cb0">200 OK</text>

  <!-- idle -->
  <rect x="150" y="115" width="340" height="60" fill="#f2f2f2" rx="6"/>
  <text x="320" y="140" text-anchor="middle" fill="#555">connection sits idle</text>
  <text x="320" y="160" text-anchor="middle" fill="#555">(LB keeps it 600s, app keeps it 5s)</text>

  <!-- app closes at 5s -->
  <text x="512" y="205" fill="#c53030">5s: idle timer fires,</text>
  <text x="512" y="223" fill="#c53030">app closes it</text>
  <line x1="500" y1="210" x2="144" y2="260" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#red)"/>
  <text x="300" y="215" fill="#c53030">"closing" (FIN) on its way...</text>

  <!-- request 2 at the same moment -->
  <line x1="140" y1="215" x2="496" y2="262" stroke="#2b6cb0" stroke-width="2" marker-end="url(#blue)"/>
  <text x="20" y="220" fill="#2b6cb0">request 2</text>
  <text x="20" y="238" fill="#2b6cb0">(LB thinks the</text>
  <text x="20" y="256" fill="#2b6cb0">connection is fine)</text>

  <!-- reset -->
  <line x1="500" y1="290" x2="144" y2="290" stroke="#c53030" stroke-width="2" marker-end="url(#red)"/>
  <text x="320" y="282" text-anchor="middle" fill="#c53030">connection reset</text>

  <!-- 502 -->
  <text x="140" y="330" text-anchor="middle" font-weight="bold" fill="#c53030">502 to the client</text>
  <text x="500" y="330" text-anchor="middle" fill="#555">nothing in app logs</text>

  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker>
  </defs>
</svg>
